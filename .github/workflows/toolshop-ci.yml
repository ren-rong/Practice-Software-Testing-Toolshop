name: Toolshop UI+API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: pytest -m api -v --reruns 2 --reruns-delay 5

  ui-tests:
    name: UI + Mixed Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium (with system deps)
        run: python -m playwright install chromium --with-deps

      - name: Run UI and mixed tests (headed via xvfb)
        run: xvfb-run --auto-servernum pytest -m "ui or mixed" -v --headed --reruns 2 --reruns-delay 5

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug
          path: |
            test-results
            allure-results
          if-no-files-found: ignore
          retention-days: 7
